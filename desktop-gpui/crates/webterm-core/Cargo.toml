[package]
name = "webterm-core"
description = "WebTerm core data models, session management, actions, and application state"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flume = { workspace = true }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
webterm-supervisor = { workspace = true }
webterm-settings = { workspace = true }
webterm-backend-client = { workspace = true }
webterm-terminal = { workspace = true }
parking_lot = { workspace = true }
raw-window-handle = "=0.6.2"
dirs = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
vte = "0.15.0"
web-sys = { version = "0.3", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Location",
] }

