[package]
name = "webterm-web"
description = "WebTerm WebAssembly browser runner (GPUI Web)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "webterm-web"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3" }
gpui-component = { workspace = true }
gpui-kit = { workspace = true }
webterm-core = { workspace = true }
webterm-ui = { workspace = true }
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
webterm-supervisor = { workspace = true }
webterm-settings = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "ws", "original-uri"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
dirs = { workspace = true }
