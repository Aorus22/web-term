[package]
name = "webterm"
description = "WebTerm desktop shell (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "webterm"
path = "src/lib.rs"

[[bin]]
name = "webterm"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3" }
gpui-component = { workspace = true }
webterm-supervisor = { workspace = true }
webterm-settings = { workspace = true }
webterm-backend-client = { workspace = true }
webterm-terminal = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
