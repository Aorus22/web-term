[package]
name = "webterm"
description = "WebTerm desktop shell (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "webterm"
path = "src/lib.rs"

[[bin]]
name = "webterm"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3" }
gpui-component = { workspace = true }
webterm-supervisor = { workspace = true }
webterm-settings = { workspace = true }
webterm-backend-client = { workspace = true }
webterm-terminal = { workspace = true }
parking_lot = { workspace = true }
rfd = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
raw-window-handle = "=0.6.2"
dirs = { workspace = true }

# Linux-only: the GTK theme probe needs the GTK3 dev headers, and the CSD frame
# extents are an X11 (mutter/KWin) concept. Keeping these out of the other
# targets means a Windows/macOS build never has to find libgtk-3.so.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { workspace = true }
x11rb = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }
# Used by chaos_test to SIGKILL the backend child on unix.
libc = { workspace = true }
